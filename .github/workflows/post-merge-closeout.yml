name: Post-merge issue closeout (inlined from product-ops v0.2.1)

# Inlined because this public repo cannot `uses:` private kaushikkuberanathan/product-ops.
# Canon: product-ops/.github/workflows/post-merge-closeout.yml@v0.2.1 — keep in sync on bumps.

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  closeout:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Verify merge shape
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.info('No pull_request payload; skipping merge-shape check.');
              return;
            }
            const protectedBases = String('main')
              .split(/[,\s]+/)
              .map((name) => name.replace(/^refs\/heads\//, '').trim())
              .filter(Boolean);
            const base = String(pr.base?.ref || '').replace(/^refs\/heads\//, '');
            const verifyMergeParents = 'true' === 'true';
            if (!protectedBases.includes(base)) {
              core.info(`Skipping merge-shape check for intermediate target ${base}.`);
              return;
            }
            if (!verifyMergeParents) {
              core.info(`verify_merge_parents=false; not requiring two parents on ${base}.`);
              return;
            }
            if (!pr.merge_commit_sha) {
              core.setFailed(`PR #${pr.number} merged to ${base} but merge_commit_sha is missing.`);
              return;
            }
            const { data: commit } = await github.rest.repos.getCommit({
              ...context.repo,
              ref: pr.merge_commit_sha,
            });
            const parentCount = commit.parents.length;
            if (parentCount !== 2) {
              core.setFailed(
                `PR #${pr.number} merged to ${base} with ${parentCount} parent(s); expected 2.`
              );
              return;
            }
            core.info(`Merge SHA ${pr.merge_commit_sha} has ${parentCount} parent(s).`);

      - name: Close out linked issues
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.setFailed('post-merge-closeout requires a pull_request event payload.');
              return;
            }
            if (!pr.merged) {
              core.info(`PR #${pr.number} was not merged; skipping closeout.`);
              return;
            }

            const protectedBases = String('main')
              .split(/[,\s]+/)
              .map((name) => name.replace(/^refs\/heads\//, '').trim())
              .filter(Boolean);
            const extraBots = String('dependabot[bot],github-actions[bot],renovate[bot]')
              .split(/[,\s]+/)
              .map((login) => login.trim().toLowerCase())
              .filter(Boolean);

            const base = String(pr.base?.ref || '').replace(/^refs\/heads\//, '');
            if (!protectedBases.includes(base)) {
              core.info(`Skipping issue closeout for intermediate target ${base}.`);
              return;
            }

            const issueNumbers = [...new Set(
              [...(pr.body || '').matchAll(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi)]
                .map((match) => Number(match[1]))
            )];

            const login = String(pr.user?.login || '');
            const loginLower = login.toLowerCase();
            const isBot =
              pr.user?.type === 'Bot' ||
              loginLower.endsWith('[bot]') ||
              extraBots.includes(loginLower);

            if (issueNumbers.length === 0) {
              if (isBot) {
                core.warning(
                  `Bot PR #${pr.number} (${login || 'unknown'}) has no Closes/fixes/resolves #N; skipping issue closeout.`
                );
                return;
              }
              core.setFailed(`PR #${pr.number} has no closing issue reference.`);
              return;
            }

            const missingMilestoneIssues = [];
            const MILESTONE_WARNING_MARK = '<!-- milestone-missing-warning:v1 -->';

            for (const issueNumber of issueNumbers) {
              const { data: issue } = await github.rest.issues.get({
                ...context.repo,
                issue_number: issueNumber,
              });
              if (issue.pull_request) {
                throw new Error(`#${issueNumber} is not a repository issue.`);
              }

              const statusLabels = (issue.labels || [])
                .map((label) => (typeof label === 'string' ? label : label.name))
                .filter((name) => name && name.startsWith('status:'));
              for (const name of statusLabels) {
                await github.rest.issues.removeLabel({
                  ...context.repo,
                  issue_number: issueNumber,
                  name,
                }).catch((error) => {
                  if (error.status !== 404) throw error;
                });
              }

              // Close completed. Do not set `milestone` — never invent/auto-assign.
              await github.rest.issues.update({
                ...context.repo,
                issue_number: issueNumber,
                state: 'closed',
                state_reason: 'completed',
              });

              const comments = await github.paginate(github.rest.issues.listComments, {
                ...context.repo,
                issue_number: issueNumber,
                per_page: 100,
              });
              const activeClaim = [...comments].reverse().find((comment) =>
                comment.body?.includes('<!-- active-work-claim:v1 -->')
              );
              if (activeClaim) {
                await github.rest.issues.updateComment({
                  ...context.repo,
                  comment_id: activeClaim.id,
                  body:
                    activeClaim.body.replace(
                      '<!-- active-work-claim:v1 -->',
                      '<!-- released-work-claim:v1 -->'
                    ) + `\nReleased by post-merge closeout: PR #${pr.number}`,
                });
              }

              if (issue.assignees?.length) {
                await github.rest.issues.removeAssignees({
                  ...context.repo,
                  issue_number: issueNumber,
                  assignees: issue.assignees.map((assignee) => assignee.login),
                });
              }

              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issueNumber,
                body:
                  `Completed by PR #${pr.number} on \`${base}\` at merge \`${pr.merge_commit_sha}\`. ` +
                  'Post-merge closeout removed all `status:*` labels, released the work claim, ' +
                  'cleared assignment, and verified the issue is closed.',
              });

              // Release Hygienist: warn when the closed-out issue has no tranche
              // milestone. Never invent or auto-assign a milestone here.
              if (!issue.milestone) {
                missingMilestoneIssues.push(issueNumber);
                const alreadyWarned = comments.some((comment) =>
                  comment.body?.includes(MILESTONE_WARNING_MARK)
                );
                if (!alreadyWarned) {
                  await github.rest.issues.createComment({
                    ...context.repo,
                    issue_number: issueNumber,
                    body:
                      `${MILESTONE_WARNING_MARK}\n` +
                      'Release Hygienist: this issue had **no milestone** at closeout. ' +
                      'Open work is expected on a **tranche milestone**. ' +
                      'Attach an existing milestone (Story Refiner attach-on-file); ' +
                      'Mode B does not invent or auto-assign one.',
                  });
                }
                core.warning(
                  `Issue #${issueNumber} has no milestone; posted Release Hygienist warning (no auto-assign).`
                );
              }

              core.info(`Closed out issue #${issueNumber} from PR #${pr.number}.`);
            }

            if (missingMilestoneIssues.length) {
              const prComments = await github.paginate(github.rest.issues.listComments, {
                ...context.repo,
                issue_number: pr.number,
                per_page: 100,
              });
              const alreadyPrWarned = prComments.some((comment) =>
                comment.body?.includes(MILESTONE_WARNING_MARK)
              );
              if (!alreadyPrWarned) {
                const refs = missingMilestoneIssues.map((n) => `#${n}`).join(', ');
                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number: pr.number,
                  body:
                    `${MILESTONE_WARNING_MARK}\n` +
                    `Release Hygienist: linked issue(s) ${refs} had **no milestone** at closeout. ` +
                    'Open work is expected on a tranche milestone — attach an existing one; ' +
                    'Mode B does not invent or auto-assign milestones.',
                });
              }
            }
